name: Build Installers

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: officeghost-windows
            tauri_bundles: nsis
            artifact_paths: |
              src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            artifact_name: officeghost-macos
            tauri_bundles: dmg
            artifact_paths: |
              src-tauri/target/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend and app deps
        run: npm ci

      - name: Tool versions
        run: |
          node -v
          npm -v
          rustc -V
          cargo -V

      - name: Build rust-indexer sidecar
        run: cargo build --manifest-path rust-indexer/Cargo.toml --release

      - name: Build Tauri app
        run: npx tauri build --bundles ${{ matrix.tauri_bundles }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
