name: Build desktop installers

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-build.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: officeghost-windows
            bundles: nsis
            artifact_paths: desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            artifact_name: officeghost-macos
            bundles: dmg
            artifact_paths: desktop/src-tauri/target/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build indexer
        run: cargo build --manifest-path rust-indexer/Cargo.toml --release

      - name: Build application
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_paths }}
          if-no-files-found: error
