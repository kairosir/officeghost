name: Build desktop installers

on:
  workflow_dispatch:
    inputs:
      repair_macos_release:
        description: Rebuild and attach the macOS updater to the current version release
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-build.yml"

permissions:
  contents: write

jobs:
  build-windows:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.repair_macos_release }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build indexer
        run: cargo build --manifest-path rust-indexer/Cargo.toml --release

      - name: Stage indexer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/resources
          Copy-Item rust-indexer/target/release/rust-indexer.exe src-tauri/resources/rust-indexer.exe

      - name: Build application
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis

      - name: Publish signed Windows release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: v__VERSION__
          releaseName: OfficeGhost v__VERSION__
          releaseBody: Новая версия OfficeGhost. Установщики и автоматическое обновление находятся во вложениях.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          args: --bundles nsis

      - name: Upload installer
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: officeghost-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Build universal indexer
        run: |
          cargo build --manifest-path rust-indexer/Cargo.toml --release --target aarch64-apple-darwin
          cargo build --manifest-path rust-indexer/Cargo.toml --release --target x86_64-apple-darwin
          mkdir -p src-tauri/resources
          lipo -create \
            rust-indexer/target/aarch64-apple-darwin/release/rust-indexer \
            rust-indexer/target/x86_64-apple-darwin/release/rust-indexer \
            -output src-tauri/resources/rust-indexer
          chmod +x src-tauri/resources/rust-indexer

      - name: Build application
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.repair_macos_release }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --target universal-apple-darwin --bundles dmg

      - name: Publish signed macOS release
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.repair_macos_release }}
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: desktop
          tagName: v__VERSION__
          releaseName: OfficeGhost v__VERSION__
          releaseBody: Новая версия OfficeGhost. Установщики и автоматическое обновление находятся во вложениях.
          releaseDraft: false
          prerelease: false
          generateReleaseNotes: true
          args: --target universal-apple-darwin --bundles app,dmg

      - name: Upload installer
        if: ${{ !startsWith(github.ref, 'refs/tags/') && !inputs.repair_macos_release }}
        uses: actions/upload-artifact@v4
        with:
          name: officeghost-macos
          path: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
