<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Assistant</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="overlay">
      <div class="search-box">
        <div class="toolbar">
          <div class="title">AI Assistant</div>
          <div class="actions">
            <div class="build">Build 0.1.0</div>
            <button id="btn-settings" class="icon-btn" title="Настройки" aria-label="Настройки"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8Zm8.2 3.4c0-.4 0-.8-.1-1.1l2-1.5-1.9-3.2-2.4 1a8.2 8.2 0 0 0-1.6-.9l-.4-2.5h-4l-.4 2.5c-.6.2-1.1.5-1.6.9l-2.4-1-1.9 3.2 2 1.5a8 8 0 0 0 0 2.2l-2 1.5 1.9 3.2 2.4-1c.5.4 1 .7 1.6.9l.4 2.5h4l.4-2.5c.6-.2 1.1-.5 1.6-.9l2.4 1 1.9-3.2-2-1.5c.1-.3.1-.7.1-1.1Z"></path></svg></button>
            <button id="btn-toggle" class="icon-btn" title="Обновить" aria-label="Обновить"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 0 1 14.6-6L20.5 4v6h-6l2.3-2.3A6 6 0 1 0 18 12h2a8.5 8.5 0 0 1-16.5 0Z"></path></svg></button>
          </div>
        </div>
        <input id="query" type="text" placeholder="Искать файлы, заметки, проекты..." autocomplete="off" />
        <div id="status" class="status"></div>
        <div id="results" class="results"></div>

        <div id="settings-panel" class="settings-panel">
          <div class="settings-card">
            <div class="settings-header">
              <div class="settings-title">Настройки</div>
              <button id="settings-close" class="ghost">Закрыть</button>
            </div>
            <div class="settings-body">
              <div class="settings-nav">
                <div class="settings-nav-title">Разделы</div>
                <button class="settings-nav-item active" data-section="general">Общее</button>
                <button class="settings-nav-item" data-section="hotkeys">Горячие клавиши</button>
                <button class="settings-nav-item" data-section="behavior">Поведение</button>
              </div>
              <div class="settings-form">
                <div class="settings-section" data-section="general">
                  <label class="settings-label">Запоминать последний поиск</label>
                  <input id="settings-remember" type="checkbox" />

                  <label class="settings-label">Запоминать позицию окна</label>
                  <input id="settings-remember-pos" type="checkbox" />
                </div>

                <div class="settings-section" data-section="hotkeys">
                  <label class="settings-label">Горячая клавиша</label>
                  <input id="settings-hotkey" class="settings-input" type="text" placeholder="CommandOrControl+1" />
                </div>

                <div class="settings-section" data-section="behavior">
                  <label class="settings-label">Интервал авто‑индексации (сек)</label>
                  <input id="settings-interval" class="settings-input" type="number" min="30" step="10" />

                  <label class="settings-label">Макс. размер файла (MB)</label>
                  <input id="settings-maxsize" class="settings-input" type="number" min="1" step="1" />
                </div>

                <div class="settings-actions">
                  <button id="settings-save" class="ghost">Сохранить</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="./renderer.js"></script>
  </body>
</html>
