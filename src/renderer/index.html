<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Assistant</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="overlay">
      <div class="search-box">
        <div class="toolbar">
          <div class="title">AI Assistant</div>
          <div class="actions">
            <div class="build">Build 0.8</div>
            <button id="btn-ai-mode" class="icon-btn text-btn" title="Режим ИИ" aria-label="Режим ИИ">ИИ</button>
            <button id="btn-settings" class="icon-btn" title="Настройки" aria-label="Настройки">
              <img src="./assets/settings.png" alt="Настройки" />
            </button>
            <button id="btn-toggle" class="icon-btn" title="Обновить" aria-label="Обновить">
              <img src="./assets/reload.png" alt="Обновить" />
            </button>
            <button id="btn-close" class="icon-btn text-btn" title="Закрыть" aria-label="Закрыть">×</button>
          </div>
        </div>

        <div class="search-input">
          <span class="search-icon" aria-hidden="true">🔍</span>
          <input id="query" type="text" placeholder="Искать файлы, заметки, проекты..." autocomplete="off" />
          <button id="btn-send" class="send-btn hidden" title="Отправить (Enter)">Отправить</button>
        </div>

        <div id="status" class="status"></div>
        <div id="ai-row" class="ai-row"></div>

        <div id="ai-response" class="ai-response hidden"></div>
        <div id="ai-files" class="ai-files hidden"></div>
        <div id="ai-created" class="ai-created hidden"></div>
        <div id="no-results" class="no-results hidden">Результатов нет</div>
        <div id="results" class="results hidden"></div>
      </div>
    </div>

    <script src="./renderer.js"></script>
  </body>
</html>
